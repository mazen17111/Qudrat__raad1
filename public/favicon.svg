<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Brand Royal Blue -->
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Golden Amber Lightning Bolt Gradient -->
    <linearGradient id="zapGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fcd34d"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Energy Glow & Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Base (Same as Platform Header Logo rounded-2xl) -->
  <rect x="20" y="20" width="472" height="472" rx="120" ry="120" fill="url(#brandBg)"/>
  
  <!-- Subtle Highlight Border for contrast on dark/light browsers -->
  <rect x="23" y="23" width="466" height="466" rx="117" ry="117" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.5"/>

  <!-- Energy Halo behind the Lightning Bolt -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.22" filter="url(#softGlow)"/>

  <!-- Exact Lucide Zap Symbol (منصة أقسام رعد ⚡) scaled to perfection -->
  <g transform="translate(68, 68) scale(15.666667)">
    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"
          fill="url(#zapGold)"
          stroke="#ffffff"
          stroke-width="1.1"
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#softGlow)"/>
  </g>
</svg>

    <!-- Prevent stale caching so students always get the latest platform updates instantly -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="apple-touch-icon-precomposed" href="/favicon.svg" />

    <!-- Instant Platform Logo Sync on Any Browser Boot -->
    <script>
      (function() {
        try {
          var savedLogo = localStorage.getItem('raad_platform_logo_url');
          if (savedLogo) {
            var iconLinks = document.querySelectorAll("link[rel*='icon'], link[rel*='apple-touch-icon']");
            iconLinks.forEach(function(link) {
              link.href = savedLogo;
            });
          }
        } catch (e) {}
      })();
    </script>

    <!-- Windows & Edge Shortcuts Tile Image -->
    <meta name="msapplication-TileImage" content="/icon-512.png?v=3" />
